<svg width="120" height="160" viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="zGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6dd5fa"/>
      <stop offset="100%" stop-color="#2980b9"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Trebuchet MS', sans-serif; font-weight: 700; fill: url(#zGrad); }
    .z1 { animation: floatUp 3s ease-in infinite; }
    .z2 { animation: floatUp 3s ease-in infinite; animation-delay: 1s; }
    .z3 { animation: floatUp 3s ease-in infinite; animation-delay: 2s; }
    @keyframes floatUp {
      0% { opacity: 0; transform: translate(0,0) scale(0.6); }
      15% { opacity: 1; }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translate(20,-70) scale(1.3); }
    }
  </style>
  <text class="z1" x="20" y="140" font-size="18">Z</text>
  <text class="z2" x="35" y="120" font-size="24">Z</text>
  <text class="z3" x="55" y="95" font-size="30">Z</text>
</svg>
