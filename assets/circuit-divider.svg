<svg width="100%" height="60" viewBox="0 0 800 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6dd5fa" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6dd5fa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2980b9" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .flow { stroke-dasharray: 12 8; animation: dash 2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -200; } }
    .node { animation: blink 1.6s ease-in-out infinite; }
    .node:nth-child(3) { animation-delay: .3s; }
    .node:nth-child(4) { animation-delay: .6s; }
    .node:nth-child(5) { animation-delay: .9s; }
    @keyframes blink { 0%,100% { opacity:.3; } 50% { opacity:1; } }
  </style>
  <line x1="0" y1="30" x2="800" y2="30" stroke="url(#lineGrad)" stroke-width="2" class="flow"/>
  <circle class="node" cx="120" cy="30" r="4" fill="#6dd5fa"/>
  <circle class="node" cx="320" cy="30" r="4" fill="#2980b9"/>
  <circle class="node" cx="520" cy="30" r="4" fill="#6dd5fa"/>
  <circle class="node" cx="700" cy="30" r="4" fill="#2980b9"/>
</svg>
